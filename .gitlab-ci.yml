stages:
  - build
  - deploy

create_image:
  stage: build
  tags:
    - deploy_demo
  before_script:
    - docker version
  script:
    - bash docker/scripts/create_image.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "frontend"'

deploy_demo:
  stage: deploy
  tags:
    - deploy_demo
  needs:
    - create_image
  before_script:
    - docker version
    - docker compose version
  script:
    - bash docker/scripts/deploy_demo.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "frontend"'
