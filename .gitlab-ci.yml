stages:
  - build_verify_publish
  - deploy

build_test_push_image:
  stage: build_verify_publish
  tags:
    - deploy_demo
  before_script:
    - docker version
    - docker compose version
  script:
    - bash docker/scripts/build_test_push_image.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "frontend"'

deploy_demo:
  stage: deploy
  tags:
    - deploy_demo
  needs:
    - build_test_push_image
  before_script:
    - docker version
    - docker compose version
  script:
    - bash docker/scripts/deploy_demo.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "frontend"'
