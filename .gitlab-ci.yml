workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "frontend"'
    - when: never

default:
  tags:
    - deploy_demo
  before_script:
    - docker version
    - docker compose version

stages:
  - build
  - test
  - publish
  - deploy

build_image:
  stage: build
  script:
    - bash docker/scripts/create_image_local.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "frontend"'
    - when: never

test_image:
  stage: test
  needs:
    - build_image
  variables:
    HEALTHCHECK_INTERVAL_SECONDS: "5"
    HEALTHCHECK_RETRIES: "90"
  script:
    - bash docker/scripts/test_image.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "frontend"'
    - when: never

push_image:
  stage: publish
  needs:
    - test_image
  script:
    - bash docker/scripts/push_image.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "frontend"'
    - when: never

deploy_demo:
  stage: deploy
  needs:
    - push_image
  resource_group: demo-deploy
  script:
    - bash docker/scripts/deploy_demo.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "frontend"'
    - when: never
