services:
  postgres:
    image: 'postgres:17.4'
    container_name: 'privacy_dashboard_db_dev'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - privacy_dashboard_volume_dev:/var/lib/postgresql/data

volumes:
  privacy_dashboard_volume_dev: